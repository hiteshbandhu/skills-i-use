name: Sync marketplace manifest

# Keeps .claude-plugin/marketplace.json in lockstep with the skills/ folders so a
# new skill is discoverable in Claude Code without manual manifest edits.
#
# main is protected by a ruleset, and on a personal repo the github-actions[bot]
# cannot be granted a ruleset bypass. So the push uses SYNC_TOKEN — a fine-grained
# PAT owned by a bypass actor (the repo owner) — which lands the commit on main.
# If SYNC_TOKEN is unset the checkout falls back to GITHUB_TOKEN; the push will then
# fail against protected main (set the secret to enable auto-sync).
on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".claude-plugin/marketplace.json"
      - "scripts/sync-marketplace.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT of a ruleset bypass actor; falls back to GITHUB_TOKEN if unset.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync manifest and commit if changed
        run: |
          node scripts/sync-marketplace.mjs
          if git diff --quiet -- .claude-plugin/marketplace.json; then
            echo "Manifest already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: auto-sync marketplace manifest [skip ci]"
          git push
